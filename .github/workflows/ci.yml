name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tractor
          POSTGRES_DB: tractor
          POSTGRES_PASSWORD: tractor-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tractor -d tractor"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://tractor:tractor-ci-only@127.0.0.1:5432/tractor
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose -f infrastructure/compose.yaml config --quiet
      - name: Build production containers
        run: docker compose -f infrastructure/compose.yaml build --pull=false
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
